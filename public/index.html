<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDP-1 Music Player</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <main>
      <div id="pdp1-ui">
        <div class="inputs">
          <span class="ui-label">TW:</span> <input id="tw-input" disabled />
          <button id="recompile" disabled>recompile</button>
        </div>
        <div id="program-flags">
          <div class="bulb-container"><div class="bulb"></div></div>
          <div class="bulb-container"><div class="bulb"></div></div>
          <div class="bulb-container"><div class="bulb"></div></div>
          <div class="bulb-container"><div class="bulb"></div></div>
        </div>
      </div>
      <div id="logs-header">
        <button id="upload">upload</button>
      </div>
      <div id="temperament-control">
        <label for="temperament-select" class="ui-label">Temperament:</label>
        <select id="temperament-select">
          <option value="equal" selected>Equal</option>
          <option value="werckmeister3">Werckmeister III</option>
          <option value="werckmeister4">Werckmeister IV</option>
          <option value="werckmeister5">Werckmeister V</option>
          <option value="kirnberger2">Kirnberger II</option>
          <option value="kirnberger3">Kirnberger III</option>
          <option value="vallotti">Vallotti</option>
          <option value="young2">Young II</option>
          <option value="kellner">Kellner</option>
          <option value="meantone">&frac14;-comma Meantone</option>
          <option value="silbermann">Silbermann</option>
          <option value="pythagorean">Pythagorean</option>
          <option value="just">Just (C major)</option>
        </select>
        <span class="pitch-group">
          <span class="ui-label">Pitch:</span>
          <label class="tuning-opt"><input type="checkbox" id="chm-checkbox" /> CHM offset</label>
          <label class="tuning-opt"><input type="checkbox" id="a415-checkbox" /> A415</label>
        </span>
      </div>
      <ul id="playlist"></ul>
      <div id="logs-pane">
        <div id="logs-label" class="ui-label">PDP-1 logs:</div>
        <div id="logs"></div>
      </div>
    </main>
    <script src="scripts/main.js"></script>
  </body>
